LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_connect_module modules/mod_proxy_connect.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule ssl_module modules/mod_ssl.so

<VirtualHost *:80>
    ServerName market.tlakepro.com

    # Redirect all HTTP traffic to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

<VirtualHost *:80>
    ServerName admin.market.tlakepro.com

    # Redirect all HTTP traffic to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

<VirtualHost *:80>
    ServerName vendor.tlakepro.com

    # Redirect all HTTP traffic to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

Listen 443
<VirtualHost *:443>
    ServerName backend.tlakepro.com

# Security headers
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # SSLEngine on
    # SSLCertificateFile /etc/letsencrypt/live/market.tlakepro.com/cert.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/market.tlakepro.com/privkey.pem
    # SSLCertificateChainFile /etc/letsencrypt/live/market.tlakepro.com/chain.pem

    # Proxy configuration
    ProxyPreserveHost On
    ProxyRequests Off

    <Location />
        ProxyPass http://localhost:9000/
        ProxyPassReverse http://localhost:9000/

        ProxyPassReverseCookieDomain localhost backend.market.tlakepro.com
        RewriteEngine on
        RewriteCond %{HTTP:Upgrade} websocket [NC]
        RewriteCond %{HTTP:Connection} upgrade [NC]
        RewriteRule ^/?(.*) "ws://localhost:9000/$1" [P,L]
    </Location>
</VirtualHost>

<VirtualHost *:443>
    ServerName market.tlakepro.com

# Security headers
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # SSLEngine on
    # SSLCertificateFile /etc/letsencrypt/live/market.tlakepro.com/cert.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/market.tlakepro.com/privkey.pem
    # SSLCertificateChainFile /etc/letsencrypt/live/market.tlakepro.com/chain.pem

    # Proxy configuration
    ProxyPreserveHost On
    ProxyRequests Off

    # Proxy all requests to Node.js on port 3001
    <Location />
        ProxyPass http://localhost:3001/
        ProxyPassReverse http://localhost:3001/

        ProxyPassReverseCookieDomain localhost market.tlakepro.com
        RewriteEngine on
        RewriteCond %{HTTP:Upgrade} websocket [NC]
        RewriteCond %{HTTP:Connection} upgrade [NC]
        RewriteRule ^/?(.*) "ws://localhost:3001/$1" [P,L]
    </Location>
</VirtualHost>

<VirtualHost *:443>
    ServerName admin.market.tlakepro.com

# Security headers
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # SSLEngine on
    # SSLCertificateFile /etc/letsencrypt/live/market.tlakepro.com/cert.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/market.tlakepro.com/privkey.pem
    # SSLCertificateChainFile /etc/letsencrypt/live/market.tlakepro.com/chain.pem

    DocumentRoot /usr/local/apache2/htdocs/admin-panel

    <Directory "/usr/local/apache2/htdocs/admin-panel">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L,QSA]
    </Directory>
</VirtualHost>

<VirtualHost *:443>
    ServerName vendor.market.tlakepro.com

# Security headers
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # SSLEngine on
    # SSLCertificateFile /etc/letsencrypt/live/market.tlakepro.com/cert.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/market.tlakepro.com/privkey.pem
    # SSLCertificateChainFile /etc/letsencrypt/live/market.tlakepro.com/chain.pem

    DocumentRoot /usr/local/apache2/htdocs/vendor-panel

    <Directory "/usr/local/apache2/htdocs/vendor-panel">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L,QSA]
    </Directory>
</VirtualHost>

